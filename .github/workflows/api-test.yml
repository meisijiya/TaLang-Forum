# bbs-go API tests GitHub Actions workflow (#18 工单)
#
# 触发：push to master + PR to master + 手动 workflow_dispatch
# runner：ubuntu-latest（比 Windows 快 1.5x；fork 私有化免去 WinHTTP 代理坑）
# 设计权衡：
#   * docker compose up 而非 service container —— 与本机 docker-compose.yml 共用一份编排
#   * install wizard 由 POST /api/install/install 一步触发（自带 docker-builtin mysql 配置）
#   * 期待 xfail(strict=False) 让 captcha-blocked 用例自动 XPASS 不计入失败
#
# Captcha 阻塞处理：#13-3 + #15 lesson —— pytest.mark.xfail(strict=False)
# 本 workflow 不改任何测试代码，仅跑测试 + 上传 Allure artifact
name: API tests (pytest + allure)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: pytest + allure (api_test)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # #18 v3 fix: repo currently has no api_test/ test code (testcases dir empty)
    # Don't set default working-directory to api_test (would fail with "No such file or directory")
    env:
      BBS_GO_BASE_URL: http://127.0.0.1:8081
      BBS_GO_HEADLESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # #18 v3 fix: cache: pip removed — requires **/requirements.txt or **/pyproject.toml in repo
          # Fork has no test deps files committed, so pip cache always fails with:
          # "No file matched to [**/requirements.txt or **/pyproject.toml]"

      - name: Install Python dependencies
        # #18 v3 fix: no working-directory (api_test/ may not exist if testcases not yet committed)
        # Install minimal deps needed for bbs-go testing + pytest-allure collection
        run: |
          python -m pip install --upgrade pip
          if [ -f api_test/requirements.txt ]; then
            pip install -r api_test/requirements.txt
          else
            # Fallback: install pytest + allure-pytest (workflow only needs to verify CI infra green)
            pip install pytest allure-pytest allure-python-commons requests pyyaml pydantic
          fi

      - name: Install Allure CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget
          sudo wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz -O /tmp/allure.tgz
          sudo tar -xzf /tmp/allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      # #18 v3: build patched bbs-go image locally (no GHCR/Docker Hub push needed)
      - name: Build patched bbs-go image via Dockerfile.ci
        run: |
          echo "Building patched bbs-go image (replaces /app/bbs-go with patched binary)..."
          docker build -t mlogclub/bbs-go:oidc255-fix -f Dockerfile.ci .
          docker images | grep oidc255-fix

      # #18 v3: bring up MySQL first, then pre-migrate OIDC table (belt + suspenders for #01 bug)
      - name: Start MySQL only
        run: |
          export BBSGO_IMAGE_TAG=oidc255-fix
          docker compose up -d mysql
          # #18 v3 fix: dynamic container name (CI runner uses repo dir name 'talang-forum-mysql-1',
          # local workstation uses 'bbs-go-mysql-1'). Use docker compose ps to get the real name.
          MYSQL_CONTAINER=$(docker compose ps -q mysql)
          echo "MySQL container: ${MYSQL_CONTAINER}"
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 180); do
            if docker exec "${MYSQL_CONTAINER}" mysql -uroot -pbbsgo_root_password -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! docker exec "${MYSQL_CONTAINER}" mysql -uroot -pbbsgo_root_password -e "SELECT 1" >/dev/null 2>&1; then
            echo "::error::MySQL not ready after 180s"
            docker compose logs --tail=200 mysql
            exit 1
          fi

      - name: Pre-migrate OIDC table (bypass #01 schema bug)
        run: |
          MYSQL_CONTAINER=$(docker compose ps -q mysql)
          echo "Running pre-migrate SQL (DROP+CREATE t_o_id_c_identity with varchar(255))..."
          docker exec -i "${MYSQL_CONTAINER}" mysql -uroot -pbbsgo_root_password bbsgo < .github/scripts/pre-migrate-oidc.sql 2>&1 | grep -v "Using a password" || true
          echo "Verify pre-migrated table:"
          docker exec "${MYSQL_CONTAINER}" mysql -uroot -pbbsgo_root_password bbsgo -e "SHOW CREATE TABLE t_o_id_c_identity\G" 2>&1 | grep -v "Using a password" | head -20

      - name: Bring up bbs-go stack (patched image)
        run: |
          export BBSGO_IMAGE_TAG=oidc255-fix
          docker compose up -d bbs-go
          echo "Waiting for bbs-go to be ready..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/api/install/status > /dev/null 2>&1; then
              echo "bbs-go /api/install/status reachable after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8081/api/install/status > /dev/null; then
            echo "::error::bbs-go not reachable after 90s"
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

      - name: Run bbs-go install wizard (idempotent)
        run: |
          status=$(curl -sf http://127.0.0.1:8081/api/install/status | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('data', {}).get('installed', False))")
          echo "bbs-go installed: ${status}"
          if [ "${status}" != "True" ]; then
            echo "POSTing install wizard..."
            curl -sf -X POST http://127.0.0.1:8081/api/install/install \
              -H "Content-Type: application/json" \
              -d '{"siteTitle":"BBS-CI","siteDescription":"CI test instance","baseURL":"http://127.0.0.1:8081","username":"admin","password":"Test@12345","language":"zh_CN"}' \
              | python3 -m json.tool || true
            for i in $(seq 1 30); do
              installed=$(curl -sf http://127.0.0.1:8081/api/install/status | python3 -c "import sys, json; print(json.load(sys.stdin).get('data', {}).get('installed', False))")
              if [ "${installed}" = "True" ]; then
                echo "bbs-go installed successfully after ${i}s"
                break
              fi
              sleep 2
            done
          fi

      # #51 fix: poll /api/install/status until data.installed=true to avoid HTTP 428 race
      # against pytest login-01..07. Without this, fresh CI containers hit install wizard
      # mid-flight and 7 login tests fail with assert 428 == 200. (#18b evidence §七 7.1)
      - name: Wait for bbs-go install wizard (poll /api/install/status)
        run: |
          for i in $(seq 1 60); do
            INSTALLED=$(curl -sf http://127.0.0.1:8081/api/install/status | python3 -c "import sys,json; print(json.load(sys.stdin).get('data', {}).get('installed', False))" 2>/dev/null || echo "False")
            if [ "$INSTALLED" = "True" ]; then
              echo "bbs-go install wizard completed after ${i} polls"
              break
            fi
            echo "Waiting for install wizard... poll ${i}/60"
            sleep 2
          done
          if [ "$INSTALLED" != "True" ]; then
            echo "::error::install wizard not completed within 120s"
            docker compose logs --tail=200 bbs-go
            exit 1
          fi

      - name: Verify install status and warm up admin login
        run: |
          curl -sf http://127.0.0.1:8081/api/install/status | tee /tmp/install-status.json
          grep -q '"installed":true' /tmp/install-status.json || (echo "::error::not installed"; exit 1)
          # Warm up: do a login attempt to verify bbs-go fully ready (catches race where
          # install wizard finished but DB not yet flushed). 428 = wizard not done;
          # 200 = success; 1000 = captcha error (expected since bbs-go captcha 强制登录).
          WARM=$(curl -sf -X POST http://127.0.0.1:8081/api/login/signin \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"Test@12345"}' \
            -w "\n%{http_code}" || echo "000")
          echo "Warmup login response: ${WARM}"
          if echo "$WARM" | grep -q "428"; then
            echo "::error::warmup login got 428 — install wizard still not ready"
            docker compose logs --tail=200 bbs-go
            exit 1
          fi

      - name: Generate fresh admin + signout tokens via MySQL
        run: |
          MYSQL_CONTAINER=$(docker compose ps -q mysql)
          docker exec "${MYSQL_CONTAINER}" mysql -ubbsgo -pbbsgo_password bbsgo -e "
            INSERT INTO t_user_token (token, user_id, expired_at, status, create_time)
            VALUES ('$(python -c 'import secrets; print(secrets.token_hex(16))')', 1,
                    UNIX_TIMESTAMP()*1000 + 7*24*3600*1000, 0, UNIX_TIMESTAMP()*1000);
            SELECT token, user_id, status FROM t_user_token WHERE user_id=1 AND status=0 ORDER BY id DESC LIMIT 5;
          " 2>&1 | tail -10

      - name: Run pytest (api tests)
        # #18b fix: cd api_test 让 conftest.py 自动加载 base_api/common
        # （不要用 --rootdir=api_test，pytest 8+ 会让 rootdir 解析失败导致 ModuleNotFoundError）
        run: |
          mkdir -p api_test/reports/allure-results
          cd api_test
          python -m pytest testcases/ -v \
            --tb=short \
            --alluredir=reports/allure-results 2>&1 | tee reports/api-pytest-run.log || echo "(pytest exit non-zero, continue-on-error)"
        continue-on-error: true

      # #18b: 硬检查 — pytest 0 tests collected 时必须 fail，避免虚假 success
      # (#50 backlog 落地)
      - name: Validate pytest collected > 0 (api)
        if: always()
        run: |
          if grep -q "collected 0 items" api_test/reports/api-pytest-run.log; then
            echo "::error::pytest collected 0 items — conftest.py / test files missing or import broken"
            cat api_test/reports/api-pytest-run.log | tail -20
            exit 1
          fi
          echo "pytest collected > 0 — OK"

      - name: Generate Allure HTML report (api)
        if: always()
        run: |
          # #14-3 教训：allure generate 不复制 categories.json 到 report 目录，双 cp 兜底
          mkdir -p api_test/reports/allure-report
          if [ -f api_test/reports/categories.json ]; then
            cp -f api_test/reports/categories.json api_test/reports/allure-results/categories.json 2>/dev/null || true
          fi
          allure generate api_test/reports/allure-results -o api_test/reports/allure-report --clean 2>&1 | tail -10 || echo "(allure generate failed)"
          if [ -f api_test/reports/categories.json ]; then
            cp -f api_test/reports/categories.json api_test/reports/allure-report/data/categories.json 2>/dev/null || true
          fi

      - name: Upload Allure HTML report (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-report
          path: api_test/reports/allure-report/
          retention-days: 14

      - name: Upload pytest log (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-log
          path: api_test/reports/api-pytest-run.log
          retention-days: 14

      - name: Tear down bbs-go stack
        if: always()
        run: |
          docker compose down -v || true