# bbs-go API tests GitHub Actions workflow (#18 工单)
#
# 触发：push to master + PR to master + 手动 workflow_dispatch
# runner：ubuntu-latest（比 Windows 快 1.5x；fork 私有化免去 WinHTTP 代理坑）
# 设计权衡：
#   * docker compose up 而非 service container —— 与本机 docker-compose.yml 共用一份编排
#   * install wizard 由 POST /api/install/install 一步触发（自带 docker-builtin mysql 配置）
#   * 期待 xfail(strict=False) 让 captcha-blocked 用例自动 XPASS 不计入失败
#
# Captcha 阻塞处理：#13-3 + #15 lesson —— pytest.mark.xfail(strict=False)
# 本 workflow 不改任何测试代码，仅跑测试 + 上传 Allure artifact
name: API tests (pytest + allure)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: pytest + allure (api_test)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_test
    env:
      BBS_GO_BASE_URL: http://127.0.0.1:8081
      BBS_GO_HEADLESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api_test/requirements.txt

      - name: Install Python dependencies
        working-directory: api_test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk wget
          sudo wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz -O /tmp/allure.tgz
          sudo tar -xzf /tmp/allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      # #18 v3: build patched bbs-go image locally (no GHCR/Docker Hub push needed)
      - name: Build patched bbs-go image via Dockerfile.ci
        run: |
          echo "Building patched bbs-go image (replaces /app/bbs-go with patched binary)..."
          docker build -t mlogclub/bbs-go:oidc255-fix -f Dockerfile.ci .
          docker images | grep oidc255-fix

      # #18 v3: bring up MySQL first, then pre-migrate OIDC table (belt + suspenders for #01 bug)
      - name: Start MySQL only
        run: |
          export BBSGO_IMAGE_TAG=oidc255-fix
          docker compose up -d mysql
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 60); do
            if docker exec bbs-go-mysql-1 mysql -uroot -pbbsgo_root_password -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! docker exec bbs-go-mysql-1 mysql -uroot -pbbsgo_root_password -e "SELECT 1" >/dev/null 2>&1; then
            echo "::error::MySQL not ready after 60s"
            docker compose logs --tail=200 mysql
            exit 1
          fi

      - name: Pre-migrate OIDC table (bypass #01 schema bug)
        run: |
          echo "Running pre-migrate SQL (DROP+CREATE t_o_id_c_identity with varchar(255))..."
          docker exec -i bbs-go-mysql-1 mysql -uroot -pbbsgo_root_password bbsgo < .github/scripts/pre-migrate-oidc.sql 2>&1 | grep -v "Using a password" || true
          echo "Verify pre-migrated table:"
          docker exec bbs-go-mysql-1 mysql -uroot -pbbsgo_root_password bbsgo -e "SHOW CREATE TABLE t_o_id_c_identity\G" 2>&1 | grep -v "Using a password" | head -20

      - name: Bring up bbs-go stack (patched image)
        run: |
          export BBSGO_IMAGE_TAG=oidc255-fix
          docker compose up -d bbs-go
          echo "Waiting for bbs-go to be ready..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/api/install/status > /dev/null 2>&1; then
              echo "bbs-go /api/install/status reachable after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8081/api/install/status > /dev/null; then
            echo "::error::bbs-go not reachable after 90s"
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

      - name: Run bbs-go install wizard (idempotent)
        run: |
          status=$(curl -sf http://127.0.0.1:8081/api/install/status | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('data', {}).get('installed', False))")
          echo "bbs-go installed: ${status}"
          if [ "${status}" != "True" ]; then
            echo "POSTing install wizard..."
            curl -sf -X POST http://127.0.0.1:8081/api/install/install \
              -H "Content-Type: application/json" \
              -d '{"siteTitle":"BBS-CI","siteDescription":"CI test instance","baseURL":"http://127.0.0.1:8081","username":"admin","password":"Test@12345","language":"zh_CN"}' \
              | python3 -m json.tool || true
            for i in $(seq 1 30); do
              installed=$(curl -sf http://127.0.0.1:8081/api/install/status | python3 -c "import sys, json; print(json.load(sys.stdin).get('data', {}).get('installed', False))")
              if [ "${installed}" = "True" ]; then
                echo "bbs-go installed successfully after ${i}s"
                break
              fi
              sleep 2
            done
          fi

      - name: Generate fresh admin + signout tokens via MySQL
        run: |
          docker exec bbs-go-mysql-1 mysql -ubbsgo -pbbsgo_password bbsgo -e "
            INSERT INTO t_user_token (token, user_id, expired_at, status, create_time)
            VALUES ('$(python -c 'import secrets; print(secrets.token_hex(16))')', 1,
                    UNIX_TIMESTAMP()*1000 + 7*24*3600*1000, 0, UNIX_TIMESTAMP()*1000);
            SELECT token, user_id, status FROM t_user_token WHERE user_id=1 AND status=0 ORDER BY id DESC LIMIT 5;
          " 2>&1 | tail -10

      - name: Run pytest (api tests)
        working-directory: api_test
        run: |
          python -m pytest testcases/ -v \
            --tb=short \
            --alluredir=reports/allure-results 2>&1 | tee reports/api-pytest-run.log
        continue-on-error: true

      - name: Generate Allure HTML report (api)
        if: always()
        working-directory: api_test
        run: |
          # #14-3 教训：allure generate 不复制 categories.json 到 report 目录，双 cp 兜底
          cp -f reports/categories.json reports/allure-results/categories.json 2>/dev/null || true
          allure generate reports/allure-results -o reports/allure-report --clean 2>&1 | tail -10
          cp -f reports/categories.json reports/allure-report/data/categories.json 2>/dev/null || true

      - name: Upload Allure HTML report (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-report
          path: api_test/reports/allure-report/
          retention-days: 14

      - name: Upload pytest log (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-log
          path: api_test/reports/api-pytest-run.log
          retention-days: 14

      - name: Tear down bbs-go stack
        if: always()
        run: |
          docker compose down -v || true