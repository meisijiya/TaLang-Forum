# 登录模块测试数据（8 用例）
# 注：bbs-go 强制 captcha，登录接口必填 captchaId/captchaCode，
#     正确 captcha code 由 /api/captcha/request_angle 返回图片，需解析。
#     本测试用 cookie 注入 + 直接 SQL 注入 token 绕过（详见 conftest.py admin_client）。
cases:
  - id: login-01-no-captcha
    name: 登录无 captcha
    priority: P0
    request:
      method: POST
      path: /api/login/signin
      json:
        username: admin
        password: Test@12345
    expect:
      status: 200
      success: false
      error_message_contains: "验证码"

  - id: login-02-empty-username
    name: 用户名为空
    priority: P1
    request:
      method: POST
      path: /api/login/signin
      json:
        username: ""
        password: Test@12345
        captchaId: "dummy"
        captchaCode: "9999"
    expect:
      status: 200
      success: false

  - id: login-03-wrong-password
    name: 密码错误
    priority: P1
    request:
      method: POST
      path: /api/login/signin
      json:
        username: admin
        password: WrongPassword123!
        captchaId: "dummy"
        captchaCode: "9999"
    expect:
      status: 200
      success: false

  - id: login-04-nonexistent-user
    name: 用户不存在
    priority: P1
    request:
      method: POST
      path: /api/login/signin
      json:
        username: nonexistent_user_xyz
        password: Test@12345
        captchaId: "dummy"
        captchaCode: "9999"
    expect:
      status: 200
      success: false

  - id: login-05-empty-password
    name: 密码为空
    priority: P1
    request:
      method: POST
      path: /api/login/signin
      json:
        username: admin
        password: ""
        captchaId: "dummy"
        captchaCode: "9999"
    expect:
      status: 200
      success: false

  - id: login-06-special-chars
    name: SQL 注入尝试
    priority: P2
    request:
      method: POST
      path: /api/login/signin
      json:
        username: "admin' OR '1'='1"
        password: "' OR '1'='1"
        captchaId: "dummy"
        captchaCode: "9999"
    expect:
      status: 200
      success: false

  - id: login-07-valid-captcha-fail
    name: 合法 captcha id + 错误 code
    priority: P2
    request:
      method: POST
      path: /api/login/signin
      json:
        username: admin
        password: Test@12345
        captchaId: "valid_looking_id_but_wrong"
        captchaCode: "9999"
    expect:
      status: 200
      success: false
      error_message_contains: "验证码"

  - id: login-08-signout-no-token
    name: 登出无 token
    priority: P2
    request:
      method: POST
      path: /api/login/signout
    expect:
      status: 200
      success: true
