# 积分模块测试数据（8 用例）
cases:
  - id: score-01-rank
    name: 积分排行
    priority: P0
    request:
      method: GET
      path: /api/user/score/rank
    expect:
      status: 200
      success: true

  - id: score-02-rank-limit
    name: 积分排行限制
    priority: P1
    request:
      method: GET
      path: /api/user/score/rank
      params:
        limit: 10
    expect:
      status: 200
      success: true

  - id: score-03-logs
    name: 积分日志
    priority: P0
    needs_token: true
    request:
      method: GET
      path: /api/user/score_logs
    expect:
      status: 200
      success: true

  - id: score-04-logs-no-token
    name: 无 token 积分日志
    priority: P1
    request:
      method: GET
      path: /api/user/score_logs
    expect:
      status: 200
      success: false

  - id: score-05-checkin
    name: 签到
    priority: P0
    needs_token: true
    request:
      method: POST
      path: /api/checkin/checkin
    expect:
      status: 200
      success: true

  - id: score-06-checkin-no-token
    name: 未登录签到
    priority: P1
    request:
      method: POST
      path: /api/checkin/checkin
    expect:
      status: 200
      success: false

  - id: score-07-rank-page
    name: 积分排行分页
    priority: P2
    request:
      method: GET
      path: /api/user/score/rank
      params:
        page: 1
        pageSize: 5
    expect:
      status: 200
      success: true

  - id: score-08-logs-pagination
    name: 积分日志分页
    priority: P2
    needs_token: true
    request:
      method: GET
      path: /api/user/score_logs
      params:
        page: 1
        pageSize: 10
    expect:
      status: 200
      success: true
