[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes
markers =
    captcha_blocked: tests blocked by captcha verification (xfail with strict=False)
    slow: slow tests (>5s)
filterwarnings =
    ignore::DeprecationWarning
